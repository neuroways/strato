<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#29483A">
  <title>NeuroQuest</title>
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>
  <main class="page-shell">
    <section class="book-page" aria-labelledby="page-title">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="NeuroQuest Startseite">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>NeuroQuest</span>
        </a>

        <button id="logoutButton" class="icon-button" type="button" aria-label="Abmelden">
          <span aria-hidden="true">↪</span>
        </button>
      </header>

      <section id="arrivalScene" class="arrival-scene" aria-live="polite">
        <div class="ambient ambient-one" aria-hidden="true"></div>
        <div class="ambient ambient-two" aria-hidden="true"></div>

        <div class="scene-illustration" role="img" aria-label="Ruhige Waldlandschaft">
          <div class="moon" aria-hidden="true"></div>
          <div class="hill hill-back" aria-hidden="true"></div>
          <div class="hill hill-front" aria-hidden="true"></div>
          <div class="tree tree-one" aria-hidden="true"></div>
          <div class="tree tree-two" aria-hidden="true"></div>
          <div class="tree tree-three" aria-hidden="true"></div>
          <div class="path" aria-hidden="true"></div>
          <div id="companionBadge" class="companion-badge" aria-label="Begleiterin Luna">
            <span aria-hidden="true">🦊</span>
          </div>
        </div>

        <div class="scene-content">
          <p id="eyebrow" class="eyebrow">Dein aktuelles Abenteuer</p>
          <h1 id="page-title">NeuroQuest wird geladen</h1>
          <p id="greeting" class="greeting">Die Abenteuerkarte wird vorbereitet.</p>

          <div id="statusCard" class="status-card">
            <p id="storyTitle" class="story-title">–</p>
            <p id="chapterLine" class="chapter-line">–</p>
            <p id="locationLine" class="location-line">–</p>
          </div>

          <div class="primary-action-wrap">
            <a id="primaryAction" class="primary-button" href="#" aria-disabled="true">
              Bitte warten
            </a>
          </div>
        </div>
      </section>

      <section class="progress-section" aria-labelledby="progress-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Euer Weg</p>
            <h2 id="progress-title">Fünf Wegsteine</h2>
          </div>
          <p id="progressText" class="progress-text">Die Wegsteine werden geladen.</p>
        </div>

        <ol id="progressList" class="progress-list" aria-label="Fortschritt der fünf Runden"></ol>
      </section>

      <nav class="secondary-nav" aria-label="Weitere Bereiche">
        <a href="adventure-book.html">
          <span aria-hidden="true">📖</span>
          Abenteuerbuch
        </a>
        <a href="companion.html">
          <span aria-hidden="true">🦊</span>
          Meine Begleitung
        </a>
        <button id="retryButton" class="text-button" type="button" hidden>
          Noch einmal versuchen
        </button>
      </nav>

      <footer class="page-footer">
        <span>NeuroQuest · Version 0.1.0</span>
      </footer>
    </section>
  </main>

  <noscript>
    <div class="noscript">NeuroQuest benötigt JavaScript, um den aktuellen Abenteuerstand zu laden.</div>
  </noscript>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
