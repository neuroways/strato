<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroWays Style Core – Beispiel</title>
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>
  <a class="nw-skip-link" href="#main">Zum Inhalt springen</a>

<header class="nw-app-header">
  <div class="nw-app-header__inner">
    <a class="nw-back-link" href="/">
      <span class="nw-back-link__arrow" aria-hidden="true">←</span>
      <span>NeuroWays</span>
    </a>
    <span class="nw-app-header__brand">NeuroWays</span>
  </div>
</header>

<div class="nw-brand-wave" aria-hidden="true">
  <svg viewBox="0 0 1440 90" preserveAspectRatio="none">
    <defs>
      <linearGradient id="nwBrandGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#0A1F44"/>
        <stop offset="34%" stop-color="#008CA8"/>
        <stop offset="68%" stop-color="#7B4BA2"/>
        <stop offset="100%" stop-color="#E2A83B"/>
      </linearGradient>
    </defs>
    <path d="M0 52 C180 12, 360 84, 540 46 S900 18, 1080 52 S1260 82, 1440 40"
          fill="none"
          stroke="url(#nwBrandGradient)"
          stroke-width="7"
          stroke-linecap="round"/>
  </svg>
</div>


  <main id="main" class="nw-shell nw-section nw-stack-lg">
    <div>
      <p class="nw-eyebrow">NeuroWays</p>
      <h1>Gemeinsame Web-Basis</h1>
      <p class="nw-muted">Portal und Module teilen dieselbe visuelle Grundsprache.</p>
    </div>

    <section class="nw-panel nw-stack">
      <h2>Komponenten</h2>
      <div class="nw-cluster">
        <a class="nw-button" href="#">Primäraktion</a>
        <a class="nw-button nw-button--secondary" href="#">Sekundär</a>
        <span class="nw-badge nw-badge--active">Verfügbar</span>
        <span class="nw-badge nw-badge--warning">Offen</span>
      </div>
    </section>
  </main>
</body>
</html>
