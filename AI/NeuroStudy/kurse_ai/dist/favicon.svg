<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund mit abgerundeten Ecken -->
  <rect width="100" height="100" rx="20" fill="#3b82f6"/>
  
  <!-- Buch-Symbol (Repräsentiert Kurse & Lernen) -->
  <g transform="translate(30, 30)">
    <!-- Linke Seite des Buches -->
    <path d="M 10 5 L 15 10 L 15 35 L 10 30 Z" fill="white" opacity="0.9"/>
    
    <!-- Rechte Seite des Buches -->
    <path d="M 15 10 L 25 5 L 25 30 L 15 35 Z" fill="white"/>
    
    <!-- Mittellinie (Buchrücken) -->
    <line x1="15" y1="10" x2="15" y2="35" stroke="white" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Kleine Punkte für Warteliste/Personen -->
  <circle cx="70" cy="25" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="77" cy="25" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="70" cy="35" r="2.5" fill="white" opacity="0.8"/>
  <circle cx="77" cy="35" r="2.5" fill="white" opacity="0.8"/>
</svg>