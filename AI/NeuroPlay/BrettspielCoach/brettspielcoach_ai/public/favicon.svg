<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Game piece (stylized N for NeuroPlay) -->
  <g transform="translate(30, 25)">
    <!-- Left vertical line -->
    <rect x="5" y="0" width="6" height="50" fill="#2563eb" rx="3"/>
    
    <!-- Right vertical line -->
    <rect x="35" y="0" width="6" height="50" fill="#2563eb" rx="3"/>
    
    <!-- Diagonal connector -->
    <line x1="11" y1="40" x2="35" y2="10" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
