<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Sanfter Hintergrund -->
  <rect width="100" height="100" fill="#e0e7ff" rx="20"/>
  
  <!-- Der Mond als Basis -->
  <circle cx="50" cy="35" r="20" fill="#fbbf24"/>
  
  <!-- Erste Krone von Sternen -->
  <circle cx="35" cy="20" r="3" fill="#4f46e5"/>
  <circle cx="50" cy="12" r="3" fill="#4f46e5"/>
  <circle cx="65" cy="20" r="3" fill="#4f46e5"/>
  
  <!-- Stift darunter -->
  <line x1="50" y1="55" x2="50" y2="78" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
  <polygon points="50,80 45,70 55,70" fill="#ec4899"/>
  
  <!-- Magische Linien -->
  <line x1="30" y1="65" x2="70" y2="65" stroke="#818cf8" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Kleine Punkte am unteren Rand -->
  <circle cx="25" cy="88" r="2" fill="#4f46e5" opacity="0.5"/>
  <circle cx="50" cy="92" r="2" fill="#4f46e5" opacity="0.5"/>
  <circle cx="75" cy="88" r="2" fill="#4f46e5" opacity="0.5"/>
</svg>