<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Warm cream background -->
  <rect width="100" height="100" fill="#faf8f3" rx="16"/>
  
  <!-- Forest green circular base -->
  <circle cx="50" cy="50" r="45" fill="#3d5a47"/>
  
  <!-- Gold star (representing Lumi's magic) -->
  <path d="M50 15 L58 38 L82 38 L64 53 L72 76 L50 61 L28 76 L36 53 L18 38 L42 38 Z" 
        fill="#c9a875" 
        stroke="#faf8f3" 
        stroke-width="1"/>
  
  <!-- Small circle (Caspar's head) -->
  <circle cx="45" cy="55" r="8" fill="#faf8f3"/>
  
  <!-- Line (path forward) -->
  <line x1="25" y1="75" x2="75" y2="75" stroke="#c9a875" stroke-width="3" stroke-linecap="round"/>
</svg>
